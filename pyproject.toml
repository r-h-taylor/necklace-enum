[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "necklace-enum"
version = "0.1.0"
description = "Derivative superstructures generated as Lyndon words on the quotient group of a superlattice"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Richard Taylor"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.59"]
keywords = ["derivative structures", "enumeration", "alloys", "cluster expansion", "Lyndon words"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/r-h-taylor/necklace-enum"

[project.optional-dependencies]
ase = ["ase>=3.22"]
pymatgen = ["pymatgen"]
test = ["pytest", "ase>=3.22", "spglib"]

[project.scripts]
necklace-enum = "necklace_enum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
