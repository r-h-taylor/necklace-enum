name: publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# no token is stored; PyPI trusts this workflow in this repository.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import necklace_enum as te; assert te.count_structures(te.fcc(['A','B']), range(1, 9))[8] == 390"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
